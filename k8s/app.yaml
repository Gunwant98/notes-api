apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
spec: 
  replicas: 2
  selector:
    matchLabels:
      app: notes-api
  template: 
    metadata:
      labels:
        app: notes-api
    spec:
      containers: 
        - name: notes-api
          image: notes-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
spec:
  selector:
    app: notes-api
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP